 <header>

      <h1> Registrar Traslado </h1>

<p> Elemento a trasladar:</p>

<br>
<div class="fold">
  <select id="Trasladar" name="elemento" required>
    <option value=""> Seleccione  </option> 
    <option value="persona"> Paciente</option>
    <option value="muestra"> Muestra </option> 
    <option value="equipamiento" > Equipamiento</option>
    <option value="insumos"> Insumos</option>
  </select> 



<div class="selector2">
<div id="fold-muestra" class="fold-oculto">

  <br><br>
  <input type="text" id="nombremuestra" placeholder="nombre">
  <br><br>
  <input type="text" id="regfrigeracion" placeholder="¿Necesita refrigeración?">
</div>

<br>

<div id="fold-equipamiento" class="fold-oculto">
  <label for="tipo2"> </label>
  <input type='text' id='n_serie' placeholder="Ingrese n_serie">
  <br><br>
  <input type="text" id="descripcionquipamiento" placeholder="Descripción"> 
</div>

<br>

<div  id="fold-insumos"  class="fold-oculto">
<label  for="tipo3"></label>


<input type="text" id="nombreinsumo" placeholder="Ingrese nombre del insumo">
<br> <br>

<input type="text"  id="descripcioninsumo" placeholder="Descripción">


</div>
</div>





<p>Conductor:</p>

<br>

 <input type="text" name="nombre" id="nombre_conductor"  placeholder="Ingrese su nombre" required>

 <br> <br>
             
 <input type="number" name="C.I"  id="C.I"  placeholder="Ingrese su cédula" required>

<br>

<p> Acompañante:</p>

<select id="relacion" name="R"required>

<option value="Copiloto">Copiloto</option>  

<option value="Acompañante">Acompañante</option>

</select>

<br> <br>

<input type="text" name="nombre_acompanante" id="nombre"  placeholder="Ingrese su nombre" required>

<br> <br>

<input type="number" name="C.I" id="C.I" placeholder="Ingrese su cédula" required>

<p> Ambulancia: </p>
    

<textarea  type="text"  name="modelo" id="" cols="25" rows="5" placeholder="Ingrese un modelo:" required> </textarea>

<br> 

<p> Matricula </p>

<textarea  type="text" name="Matricula" id="" cols="25" rows="5" placeholder="Ingrese una matricula:" required> </textarea>

<br>

<input type="text" id="descripcionorigen" placeholder="Descripción" required>

<input type="time" id="" placeholder="hora" required >

<p> Destino: </p>

<input type="text" id="Descripciondestino" placeholder="Descripción" required >

<input type="date" id="" placeholder="fecha" required>

<br><br>

<input type="time" id="" placeholder="hora" required>
 

<p>  Ruta: </p>

<option value="Urbano"> Urbano </option>

<option value="Carretera"> Carretera </option>
